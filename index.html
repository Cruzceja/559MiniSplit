<!doctype html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='theme-color' content='#101010'><link rel='manifest' href='manifest.json'><title>559 Mini-Split</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#171717}header{background:#111;color:white;padding:18px;text-align:center}header img{max-width:180px;border-radius:16px}.wrap{max-width:760px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.btn{border:0;border-radius:14px;padding:18px 8px;font-weight:700;background:white;box-shadow:0 2px 8px #0002;cursor:pointer}.card{background:white;padding:16px;border-radius:14px;margin-top:14px;box-shadow:0 2px 8px #0002}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;margin:6px 0;border:1px solid #bbb;border-radius:9px}button.save{background:#111;color:white;border:0;padding:12px 18px;border-radius:9px;font-weight:700}.item{border-top:1px solid #ddd;padding:10px 0}.small{font-size:13px;color:#666}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><img src='logo.png'><div>559-367-7050</div></header><div class='wrap'><div class='grid'><button class='btn' onclick="show('Cliente')">+ NUEVO CLIENTE</button><button class='btn' onclick="show('Cotización')">+ NUEVA COTIZACIÓN</button><button class='btn' onclick="show('Trabajo')">+ NUEVO TRABAJO</button></div><div id='form' class='card' style='display:none'></div><div class='card'><h3>Historial</h3><div id='list'></div></div></div><script>
const fields={Cliente:['Nombre','Teléfono','Dirección'],Cotización:['Cliente','Teléfono','Dirección','Marca','BTU','Voltaje','Refrigerante','Precio','Notas'],Trabajo:['Cliente','Teléfono','Dirección','Marca','BTU','Voltaje','Refrigerante','Precio','Pago','Notas']};
function show(type){let h=`<h3>${type}</h3><input type='hidden' id='type' value='${type}'>`;fields[type].forEach(f=>{if(f==='Refrigerante')h+=`<select data-f='${f}'><option>R-32</option><option>R-410A</option><option>Otro</option></select>`;else if(f==='Voltaje')h+=`<select data-f='${f}'><option>120V</option><option>208/230V</option><option>Otro</option></select>`;else if(f==='Notas')h+=`<textarea data-f='${f}' placeholder='${f}'></textarea>`;else h+=`<input data-f='${f}' placeholder='${f}'>`});h+=`<button class='save' onclick='save()'>GUARDAR</button>`;let e=document.getElementById('form');e.innerHTML=h;e.style.display='block'}
function save(){let type=document.getElementById('type').value,o={type,date:new Date().toLocaleString()};document.querySelectorAll('#form [data-f]').forEach(x=>o[x.dataset.f]=x.value);let a=JSON.parse(localStorage.getItem('ms559')||'[]');a.unshift(o);localStorage.setItem('ms559',JSON.stringify(a));render();document.getElementById('form').style.display='none'}
function render(){let a=JSON.parse(localStorage.getItem('ms559')||'[]');document.getElementById('list').innerHTML=a.length?a.map((o,i)=>`<div class='item'><b>${o.type}: ${o.Nombre||o.Cliente||''}</b><div>${o.Teléfono||''} ${o.Precio?'• $'+o.Precio:''}</div><div class='small'>${o.Dirección||''}<br>${o.date}</div><button onclick='del(${i})'>Eliminar</button></div>`).join(''):'Todavía no hay registros.'}function del(i){let a=JSON.parse(localStorage.getItem('ms559')||'[]');a.splice(i,1);localStorage.setItem('ms559',JSON.stringify(a));render()}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
