<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>559 Mini-Split</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f4f5f7;
 color:#111;
}
header{
 background:#111;
 text-align:center;
 padding:28px 15px;
}
.logo{
 width:285px;
 max-width:85%;
 border-radius:20px;
}
.phone{
 color:white;
 font-size:25px;
 margin-top:8px;
}
.container{
 padding:25px;
 max-width:700px;
 margin:auto;
}
.btn{
 width:100%;
 background:white;
 border:0;
 border-radius:22px;
 padding:28px 10px;
 margin-bottom:15px;
 font-size:19px;
 font-weight:bold;
 box-shadow:0 4px 12px #ccc;
}
.card{
 background:white;
 border-radius:22px;
 padding:25px;
 margin-top:20px;
 box-shadow:0 4px 12px #ddd;
}
input,textarea{
 width:100%;
 padding:15px;
 margin:7px 0;
 border:1px solid #ccc;
 border-radius:10px;
 font-size:16px;
}
textarea{
 min-height:90px;
}
.save{
 width:100%;
 background:#111;
 color:white;
 border:0;
 padding:17px;
 margin-top:12px;
 border-radius:12px;
 font-size:17px;
 font-weight:bold;
}
.cancel{
 width:100%;
 background:#ddd;
 border:0;
 padding:15px;
 margin-top:10px;
 border-radius:12px;
 font-size:16px;
}
.record{
 border-bottom:1px solid #ddd;
 padding:15px 0;
}
.record:last-child{border-bottom:0}
.record a{
 color:#1267c4;
 text-decoration:none;
 font-weight:bold;
}
</style>
</head>

<body>

<header>
<img src="logo.png" class="logo" alt="559 Mini-Split">
<div class="phone">559-367-7050</div>
</header>

<div class="container">

<div id="menu">
<button class="btn" onclick="newClient()">+ NUEVO CLIENTE</button>
<button class="btn" onclick="alert('Próximamente: Cotizaciones')">+ NUEVA COTIZACIÓN</button>
<button class="btn" onclick="alert('Próximamente: Trabajos')">+ NUEVO TRABAJO</button>

<div class="card">
<h2>Historial de Clientes</h2>
<div id="history">Todavía no hay clientes.</div>
</div>
</div>

<div id="clientForm" class="card" style="display:none">
<h2>Nuevo Cliente</h2>

<input id="name" placeholder="Nombre completo">
<input id="phone" type="tel" placeholder="Teléfono">
<input id="address" placeholder="Dirección">
<input id="city" placeholder="Ciudad">
<input id="email" type="email" placeholder="Email">
<textarea id="notes" placeholder="Notas del cliente"></textarea>

<button class="save" onclick="saveClient()">GUARDAR CLIENTE</button>
<button class="cancel" onclick="cancelForm()">Cancelar</button>
</div>

</div>

<script>
function newClient(){
 document.getElementById("menu").style.display="none";
 document.getElementById("clientForm").style.display="block";
}

function cancelForm(){
 document.getElementById("clientForm").style.display="none";
 document.getElementById("menu").style.display="block";
}

function saveClient(){
 let name=document.getElementById("name").value.trim();
 let phone=document.getElementById("phone").value.trim();

 if(!name){
  alert("Escribe el nombre del cliente.");
  return;
 }

 let client={
  id:Date.now(),
  name:name,
  phone:phone,
  address:document.getElementById("address").value.trim(),
  city:document.getElementById("city").value.trim(),
  email:document.getElementById("email").value.trim(),
  notes:document.getElementById("notes").value.trim(),
  date:new Date().toLocaleDateString()
 };

 let clients=JSON.parse(localStorage.getItem("clients559")||"[]");
 clients.unshift(client);
 localStorage.setItem("clients559",JSON.stringify(clients));

 document.getElementById("name").value="";
 document.getElementById("phone").value="";
 document.getElementById("address").value="";
 document.getElementById("city").value="";
 document.getElementById("email").value="";
 document.getElementById("notes").value="";

 cancelForm();
 renderClients();
 alert("Cliente guardado correctamente.");
}

function renderClients(){
 let clients=JSON.parse(localStorage.getItem("clients559")||"[]");
 let history=document.getElementById("history");

 if(!clients.length){
  history.innerHTML="Todavía no hay clientes.";
  return;
 }

 history.innerHTML=clients.map(c=>`
  <div class="record">
   <strong>${escapeHtml(c.name)}</strong><br>
   ${c.phone ? `📞 <a href="tel:${escapeHtml(c.phone)}">${escapeHtml(c.phone)}</a><br>` : ""}
   ${c.address ? `📍 ${escapeHtml(c.address)}${c.city ? ", "+escapeHtml(c.city) : ""}<br>` : ""}
   ${c.email ? `✉️ ${escapeHtml(c.email)}<br>` : ""}
   ${c.notes ? `📝 ${escapeHtml(c.notes)}<br>` : ""}
   <small>Agregado: ${escapeHtml(c.date)}</small>
  </div>
 `).join("");
}

function escapeHtml(value){
 return String(value).replace(/[&<>"']/g,function(m){
  return ({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#039;"
  })[m];
 });
}

renderClients();
</script>

</body>
</html>
